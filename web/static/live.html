<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dailies — rolling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same instrument as the report view, in its operating mode rather than its reading
   mode. The report is read at a desk; this is glanced at from three feet away while
   something else has your attention, so everything is bigger, there is one verdict
   at a time, and the verdict is legible without focusing on it. */
:root {
  --body: #31363B; --well: #272B2F; --raised: #3B4147; --engrave: #1E2225;
  --edge: #4A5157; --edge-bright: #5C646B;
  --ink: #E3E7E9; --ink-dim: #A2ABB1; --ink-faint: #767F86;
  --accent: #2FBF84; --accent-deep: #1B7A54;
  --alert: #C4553C; --alert-deep: #7E3324;
  --sans: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "Chivo Mono", ui-monospace, Consolas, monospace;
}
:root[data-theme="light"] {
  --body: #C6CBCE; --well: #B3B9BD; --raised: #D6DBDE; --engrave: #9AA1A6;
  --edge: #8D959A; --edge-bright: #FFFFFF;
  --ink: #1B1F22; --ink-dim: #4A5257; --ink-faint: #6C757A;
  --accent: #136B49; --accent-deep: #0C4A32; --alert: #8E3524; --alert-deep: #5E2117;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--body); color: var(--ink); font-family: var(--sans);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  /* Nothing may push the page wider than the device. On a phone held on set there is no
     horizontal scrollbar to rescue a control that has drifted off the edge. */
  max-width: 100vw;
}
video, canvas { max-width: 100%; }

header {
  background: var(--raised); border-bottom: 1px solid var(--engrave);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  padding: 12px 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
.spacer { flex: 1; }
select, .btn {
  background: var(--raised); color: var(--ink); font-family: var(--sans);
  border: 1px solid var(--engrave); border-top-color: var(--edge-bright);
  border-radius: 2px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
}
.btn:active { border-top-color: var(--engrave); border-bottom-color: var(--edge-bright); box-shadow: inset 0 2px 0 rgba(0,0,0,.3); }
.btn.rolling { background: var(--alert-deep); border-top-color: var(--alert); color: #fff; }
.btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select { text-transform: none; letter-spacing: 0; font-weight: 400; }

/* Two-position mode switch, matching the report view. The current position is depressed
   into the plate. */
.modes { display: flex; border: 1px solid var(--engrave); border-radius: 2px; overflow: hidden; }
.modes a {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  padding: 7px 15px; text-decoration: none; color: var(--ink-dim);
  background: var(--raised); border-top: 1px solid var(--edge-bright);
  border-right: 1px solid var(--engrave);
}
.modes a:last-child { border-right: 0; }
.modes a:hover { color: var(--ink); }
.modes a[aria-current] {
  color: var(--accent); background: var(--well); border-top: 1px solid var(--engrave);
  box-shadow: inset 0 2px 0 rgba(0,0,0,.3), inset 0 -1px 0 rgba(255,255,255,.05);
}
.modes a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; min-width: 0; }
/* minmax(0, 1fr), not 1fr. A bare 1fr track still floors at its content's min-content
   width, so the video's intrinsic camera resolution would push this wider than the phone
   it is being held on. */
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }

/* min-width: 0 is load-bearing, not tidying. A grid item defaults to min-width: auto,
   which means it refuses to shrink below its content's intrinsic size. The video element
   reports the camera's own width (640px and up), so without this the track floors at the
   camera resolution, the grid grows wider than a phone screen, and the header stretches
   with it until the controls sit off the right edge. */
.stage { position: relative; background: var(--engrave); overflow: hidden; min-width: 0; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
canvas { display: none; }

/* The verdict. Big enough to read peripherally, because the operator is watching the
   scene, not this screen. */
.verdict {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 20px 24px; background: linear-gradient(to top, rgba(20,23,26,.94), rgba(20,23,26,0));
}
.state {
  font-size: 40px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  line-height: 1;
}
.state.hold { color: var(--accent); }
.state.break { color: var(--alert); }
.state.idle { color: var(--ink-faint); }
.detail { font-size: 20px; margin-top: 8px; color: var(--ink); }
.detail em { color: var(--alert); font-style: normal; font-weight: 600; }
.note { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 8px; }

.pill {
  position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 8px;
  background: rgba(20,23,26,.82); border: 1px solid var(--engrave); border-radius: 2px;
  padding: 6px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
.dot.on { background: var(--alert); animation: blink 1.2s steps(1,end) infinite; }
@keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: .25 } }

.side {
  background: var(--body); border-left: 1px solid var(--engrave);
  overflow-y: auto; padding: 18px 20px;
}
h2 {
  margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .2em;
  text-transform: uppercase; color: var(--ink-dim);
  display: flex; align-items: center; gap: 8px;
}
h2::before { content: ""; width: 3px; height: 12px; background: var(--accent); }
.ref { list-style: none; margin: 0 0 22px; padding: 0; }
.ref li {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid var(--engrave); font-size: 14px;
}
.ref li:last-child { border-bottom: 0; }
.ref .pos { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
.ref li.flagged { background: var(--well); margin: 0 -8px; padding: 7px 8px; }
.ref li.flagged .nm { color: var(--alert); font-weight: 600; }
.ref li.flagged .pos { color: var(--alert); }

.log { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 11.5px; }
.log li { padding: 5px 0; border-bottom: 1px solid var(--engrave); color: var(--ink-faint); display: flex; gap: 9px; }
.log li b { color: var(--ink-dim); font-weight: 400; }
.log li.hit { color: var(--alert); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* A phone is the real operating position: worn glasses, phone in hand, on a set. At 390px
   the spacer was eating the row and pushing Roll off the screen entirely, which made the
   only control that matters unreachable in the only place this gets used. Roll now takes
   its own full-width row with a proper thumb target, and the readout drops, because
   telemetry is worth nothing if the button is gone. */
@media (max-width: 640px) {
  /* Grid, not flex-wrap. Wrapping put the scene selector on the title row where it
     overflowed the viewport and clipped, and pushed Roll off the screen entirely. An
     explicit two-column grid makes every row deliberate instead of emergent. */
  header {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px;
    align-items: stretch;
  }
  h1 { grid-column: 1 / -1; font-size: 15px; letter-spacing: .16em; }
  .modes { grid-column: 1 / -1; }
  .modes a { flex: 1; text-align: center; }
  select { width: 100%; min-width: 0; padding: 10px; }
  #roll { grid-column: 1 / -1; padding: 15px; font-size: 16px; }
  .spacer, .readout { display: none; }
  .state { font-size: 30px; }
  .detail { font-size: 16px; }
  .verdict { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>Rolling</h1>
  <nav class="modes" aria-label="Mode">
    <a href="/">Report</a>
    <a href="/live" aria-current="page">Rolling</a>
  </nav>
  <select id="scene" aria-label="Scene"></select>
  <select id="ref" aria-label="Reference take"></select>
  <select id="cam-pick" aria-label="Camera" title="Camera"></select>
  <span class="spacer"></span>
  <span class="readout" id="stats" style="font-family:var(--mono);font-size:11px;color:var(--ink-faint)"></span>
  <button class="btn" id="roll">Roll</button>
</header>

<main>
  <div class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="grab"></canvas>
    <div class="pill"><span class="dot" id="dot"></span><span id="pillText">standby</span></div>
    <div class="verdict">
      <div class="state idle" id="state">Standby</div>
      <div class="detail" id="detail">Pick a reference take and press Roll.</div>
      <div class="note" id="note"></div>
    </div>
  </div>

  <aside class="side">
    <h2>Reference</h2>
    <ul class="ref" id="refList"></ul>
    <h2>Checks</h2>
    <ul class="log" id="log"></ul>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
if (["light","dark"].includes(new URLSearchParams(location.search).get("theme")))
  document.documentElement.setAttribute("data-theme", new URLSearchParams(location.search).get("theme"));

// 512px: full glasses capture is 1552x2064, which is far more pixels than "did the mug
// move" needs, and every one of them costs upload and inference time.
const FRAME_W = 512;

// Gap BETWEEN checks, not a fixed cadence. The check itself takes 4-14 seconds, so a
// timer firing every few seconds would stack overlapping requests until the queue
// collapsed. Each check is scheduled only once the previous one has answered.
const GAP_MS = 2500;

let rolling = false, timer = null, reference = [], checks = 0, hits = 0;

async function api(p, opts) {
  const r = await fetch(p, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
  return d;
}

// A frame with no light in it is not a frame, and this is the second time this project has
// had to learn it. On this laptop, camera index 0 is a Windows Hello IR sensor that returns
// pure black while every API call succeeds; detect.py already scans for a lit camera for
// exactly that reason. The browser hits the same thing with a privacy shutter closed:
// videoWidth is a healthy 1280, frames arrive on schedule, and every one of them is black.
//
// That is worse here than a blank preview, because the model is honest about it. Shown
// nothing, it correctly reports that nothing contradicts the reference, and the UI turns that
// into a green HOLDS. A continuity tool that says "all good" while blind is the precise
// failure this project exists to avoid, and it is the one kind a user cannot catch by reading
// the verdict, because the verdict looks right.
//
// So measure the frame before trusting it: mean luminance and spread, on a cheap subsample.
// A lens cap, a closed shutter and an IR sensor all read near zero on both.
function frameStats(canvas) {
  const px = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
  let sum = 0, sumSq = 0, n = 0;
  for (let i = 0; i < px.length; i += 160) {   // every 40th pixel is plenty
    const l = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    sum += l; sumSq += l * l; n++;
  }
  const mean = sum / n;
  return { mean, sd: Math.sqrt(Math.max(0, sumSq / n - mean * mean)) };
}

const DARK_MEAN = 8;   // below this the image is essentially black
const FLAT_SD = 3;     // and this flat means no detail, not merely a dim room

function grabFrame() {
  const v = $("cam"), c = $("grab");
  if (!v.videoWidth) return null;
  const scale = FRAME_W / v.videoWidth;
  c.width = FRAME_W;
  c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const { mean, sd } = frameStats(c);
  if (mean < DARK_MEAN && sd < FLAT_SD) return { blank: true, mean, sd };
  return { data: c.toDataURL("image/jpeg", 0.72), mean, sd };
}

function renderReference(flagged = new Set()) {
  const ul = $("refList");
  ul.innerHTML = "";
  for (const o of reference) {
    if (o.category === "actor") continue;
    const li = document.createElement("li");
    if (flagged.has(o.entity)) li.className = "flagged";
    li.innerHTML = `<span class="nm">${esc(o.entity)}</span><span class="pos">${esc(o.position_h)}</span>`;
    ul.appendChild(li);
  }
}

function logCheck(ms, divs) {
  const ul = $("log");
  const li = document.createElement("li");
  if (divs.length) li.className = "hit";
  const t = new Date().toLocaleTimeString([], { hour12: false });
  li.innerHTML = `<b>${t}</b><span>${divs.length ? divs.map(d => esc(d.entity)).join(", ") : "holds"}</span><span style="margin-left:auto">${ms}ms</span>`;
  ul.insertBefore(li, ul.firstChild);
  while (ul.children.length > 40) ul.removeChild(ul.lastChild);
}

async function checkOnce() {
  const grabbed = grabFrame();
  if (!grabbed) return;

  // Refuse to answer rather than answer about nothing. Sending a black frame costs a model
  // call and comes back "nothing contradicts the reference", which reads as a pass.
  if (grabbed.blank) {
    $("state").className = "state idle";
    $("state").textContent = "No image";
    $("detail").textContent =
      "The camera is delivering black frames. A privacy shutter, a lens cap, or an IR sensor " +
      "picked instead of the webcam. Switch camera above. Not checking until there is a picture.";
    $("note").textContent = `frame luminance ${grabbed.mean.toFixed(1)}, spread ${grabbed.sd.toFixed(1)}`;
    return;
  }

  try {
    const res = await api("/api/live/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        frame: grabbed.data,
        scene_id: $("scene").value,
        reference_take: $("ref").value,
        scene_context: null,
      }),
    });
    checks++;
    const divs = res.divergences || [];
    if (divs.length) hits++;

    if (divs.length) {
      $("state").className = "state break";
      $("state").textContent = "Off the mark";
      $("detail").innerHTML = divs.map(d =>
        `<em>${esc(d.entity)}</em> — reference has it ${esc(d.expected)}, frame shows ${esc(d.observed)}`
      ).join("<br>");
    } else {
      $("state").className = "state hold";
      $("state").textContent = "Holds";
      $("detail").textContent = "Nothing contradicts the reference.";
    }
    $("note").textContent = `${res.frame_note || ""}  ·  ${res.latency_ms}ms · ${res.model}`;
    $("stats").textContent = `${checks} checks · ${hits} flagged`;
    renderReference(new Set(divs.map(d => d.entity)));
    logCheck(res.latency_ms, divs);
  } catch (err) {
    $("state").className = "state idle";
    $("state").textContent = "Check failed";
    $("detail").textContent = err.message;
  }
}

let currentStream = null;

function stopStream() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  currentStream = null;
}

// Open one specific camera and wait for it to actually produce pixels. getUserMedia
// resolving is not the same as the video element having a frame: read videoWidth too early
// and a perfectly good camera reports 0.
async function openCamera(deviceId) {
  stopStream();
  const constraints = {
    video: deviceId
      ? { deviceId: { exact: deviceId }, width: { ideal: 1280 } }
      : { width: { ideal: 1280 }, facingMode: "environment" },
    audio: false,
  };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  const v = $("cam");
  v.srcObject = stream;
  currentStream = stream;
  await v.play().catch(() => {});
  for (let i = 0; i < 30 && !v.videoWidth; i++) await new Promise(r => setTimeout(r, 100));
  await new Promise(r => setTimeout(r, 250));  // let auto-exposure settle before judging it
  return stream;
}

// Device labels are only exposed after permission is granted, which is why this runs after
// the first getUserMedia rather than before it.
async function listCameras(activeId) {
  const sel = $("cam-pick");
  let devices = [];
  try {
    devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  } catch { /* enumeration can fail; the picker just stays hidden */ }
  sel.innerHTML = "";
  devices.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || `Camera ${i + 1}`;
    if (d.deviceId === activeId) o.selected = true;
    sel.appendChild(o);
  });
  sel.style.display = devices.length > 1 ? "" : "none";
  return devices;
}

function activeCameraId() {
  return currentStream?.getVideoTracks()[0]?.getSettings()?.deviceId;
}

// Try cameras until one delivers a lit picture, rather than trusting whichever answers first.
//
// This used to be facingMode:"environment" and nothing else, which on this laptop selects a
// Windows Hello IR sensor: it opens without error, reports 1280x720, and streams pure black
// forever. The rolling view then ran six checks against black frames and displayed HOLDS for
// every one of them. Trusting the first camera that answers is the same mistake detect.py had
// to stop making, for the same reason, on the same machine.
async function start() {
  try {
    await openCamera(null);
  } catch (err) {
    $("state").className = "state idle";
    $("state").textContent = "No camera";
    $("detail").textContent = err.message + ". A camera is required to roll.";
    return false;
  }

  const devices = await listCameras(activeCameraId());

  if (grabFrame()?.blank && devices.length > 1) {
    for (const d of devices) {
      if (d.deviceId === activeCameraId()) continue;
      try {
        await openCamera(d.deviceId);
        if (!grabFrame()?.blank) {
          $("detail").textContent =
            `Switched to ${d.label || "another camera"}: the first one was delivering black frames.`;
          break;
        }
      } catch { /* try the next one */ }
    }
    await listCameras(activeCameraId());
  }
  return true;
}

// Sequential loop: check, wait, check again. Never two in flight at once.
async function loop() {
  while (rolling) {
    await checkOnce();
    if (!rolling) break;
    await new Promise(r => { timer = setTimeout(r, GAP_MS); });
  }
}

async function toggleRoll() {
  if (rolling) {
    rolling = false;
    clearTimeout(timer);
    $("roll").textContent = "Roll";
    $("roll").classList.remove("rolling");
    $("dot").classList.remove("on");
    $("pillText").textContent = "standby";
    $("state").className = "state idle";
    $("state").textContent = "Cut";
    return;
  }
  if (!$("cam").srcObject && !(await start())) return;
  rolling = true;
  $("roll").textContent = "Cut";
  $("roll").classList.add("rolling");
  $("dot").classList.add("on");
  $("pillText").textContent = "rolling";
  $("state").className = "state idle";
  $("state").textContent = "Checking";
  $("detail").textContent = "";
  loop();
}

// Switching camera mid-roll is deliberate and does not stop the loop: the operator can hunt
// for a working lens without losing the take. The loop grabs from the same video element, so
// replacing the stream underneath it is all that is needed.
$("cam-pick").onchange = async (e) => {
  try {
    await openCamera(e.target.value);
    const f = grabFrame();
    if (f?.blank) {
      $("state").className = "state idle";
      $("state").textContent = "No image";
      $("detail").textContent = "That camera is delivering black frames. Try another.";
    } else if (!rolling) {
      $("state").className = "state idle";
      $("state").textContent = "Standby";
      $("detail").textContent = "Camera ready.";
    }
  } catch (err) {
    $("detail").textContent = `Could not open that camera: ${err.message}`;
  }
};

async function loadReference() {
  const d = await api(`/api/live/reference/${$("scene").value}?take_id=${$("ref").value}`);
  reference = d.observations;
  renderReference();
}

async function boot() {
  const scenes = await api("/api/scenes");
  scenes.sort((a, b) => b.observation_count - a.observation_count);
  $("scene").innerHTML = scenes.map(s => `<option>${esc(s.scene_id)}</option>`).join("");

  async function fillTakes() {
    const d = await api(`/api/live/reference/${$("scene").value}`);
    $("ref").innerHTML = d.available_takes
      .map(t => `<option${t === d.reference_take ? " selected" : ""}>${esc(t)}</option>`).join("");
    await loadReference();
  }
  $("scene").onchange = fillTakes;
  $("ref").onchange = loadReference;
  $("roll").onclick = toggleRoll;
  await fillTakes();
  warmUp();
}

// Spend the cold start here, at page load, instead of on the operator's first take.
//
// A cold container's first model call once took 182 seconds while it built its first Vertex
// credential; every call after it took two. Silently making the user eat that on the shot they
// are trying to record is the worst possible place for it, and the old advice ("send a
// throwaway request first") only worked if you knew to do it.
//
// Reported rather than hidden, because a wait you can see is a different experience from one
// you cannot. The Roll button stays live throughout: this is a courtesy, not a gate.
async function warmUp() {
  const s = $("state"), d = $("detail");
  if (rolling) return;
  s.className = "state idle";
  s.textContent = "Waking";
  d.textContent = "First call to the model on a cold container can take a minute. Doing it now so your first take does not.";
  const t0 = performance.now();
  const tick = setInterval(() => {
    if (!rolling) d.textContent =
      `Waking the service, ${((performance.now() - t0) / 1000).toFixed(0)}s. You can press Roll at any time.`;
  }, 1000);
  try {
    const r = await api("/api/warm");
    clearInterval(tick);
    if (rolling) return;
    s.textContent = "Standby";
    d.textContent = r.warm
      ? `Ready. Model answered in ${r.ms}ms via ${r.model}. Pick a reference take and press Roll.`
      : `Model not reachable: ${r.detail || "unknown"}. The report view still works.`;
  } catch (e) {
    clearInterval(tick);
    if (rolling) return;
    s.textContent = "Standby";
    d.textContent = `Could not reach the service: ${e.message}`;
  }
}

boot().catch(e => { $("detail").textContent = e.message; });
</script>
</body>
</html>
